name = "vworld-proxy"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
# VWorld 인증키 발급 시 등록한 서비스 URL (domain 파라미터로 전송)
VWORLD_DOMAIN = "localhost"
# 프록시를 부를 수 있는 대시보드 주소 (쉼표로 여러 개)
ALLOWED_ORIGINS = "https://sin030327.github.io"

# 인증키는 여기에 쓰지 않는다 — 비밀값으로 넣는다:
#   npx wrangler secret put VWORLD_KEY
